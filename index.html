<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Prevent Google/Chrome automatic translation -->
    <meta name="google" content="notranslate" />

    <title>RENFLIX — Every Property. One Powerful Platform.</title>

    <meta
      name="description"
      content="RENFLIX — Manage. Rent. Maintain. Grow. The complete property operating system."
    />

    <meta name="theme-color" content="#1d4ed8" />

    <!-- iOS PWA -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/icons/icon-192.png"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="RENFLIX — Every Property. One Powerful Platform."
    />

    <meta
      property="og:description"
      content="RENFLIX — Manage. Rent. Maintain. Grow. The complete property operating system."
    />

    <meta
      property="og:image"
      content="https://renflix.onrender.com/icons/icon-512.png"
    />

    <meta
      property="og:url"
      content="https://renflix.onrender.com"
    />

    <meta
      property="og:type"
      content="website"
    />
  </head>

  <body>
    <div id="root" translate="no"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
